
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presents heheheheh 🎁</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #080b12;
            --panel: #111722;
            --panel2: #192231;
            --red: #ed4056;
            --green: #39bd83;
            --text: #f5f7fa;
            --muted: #929baa;
            --border: rgba(255,255,255,0.09);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        button, input, select {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .navbar {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 23px;
            font-weight: 800;
        }

        .logo span {
            color: var(--red);
        }

        .connection {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e5a33b;
        }

        .connection.online .connection-dot {
            background: var(--green);
        }

        .connection.offline .connection-dot {
            background: var(--red);
        }

        .hero {
            padding: 90px 20px 65px;
            text-align: center;
            background: radial-gradient(
                ellipse at 50% 0%,
                rgba(237,64,86,0.17),
                transparent 60%
            );
        }

        .hero-label {
            color: var(--green);
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -3px;
        }

        .hero h1 span {
            color: var(--red);
        }

        .hero p {
            color: var(--muted);
            margin: 20px auto 0;
            font-size: 15px;
        }

        .main {
            max-width: 1250px;
            margin: auto;
            padding: 20px 25px 90px;
        }

        .filter-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 35px;
        }

        .filter-heading {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr auto;
            gap: 15px;
            align-items: end;
        }

        .field label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 9px;
            font-weight: 700;
        }

        .field input,
        .field select {
            width: 100%;
            background: var(--panel2);
            color: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px;
            outline: none;
        }

        .apply-btn {
            background: var(--red);
            border: none;
            color: white;
            padding: 14px 23px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .apply-btn:hover {
            background: #ff596e;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin: 35px 0 20px;
        }

        .section-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 25px;
        }

        .result-count {
            color: var(--muted);
            font-size: 13px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .product {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 17px;
            overflow: hidden;
            transition: 0.25s;
        }

        .product:hover {
            transform: translateY(-5px);
            border-color: rgba(237,64,86,0.5);
        }

        .product-image {
            height: 210px;
            position: relative;
            overflow: hidden;
            background: var(--panel2);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.35s;
        }

        .product:hover .product-image img {
            transform: scale(1.05);
        }

        .category {
            position: absolute;
            top: 13px;
            left: 13px;
            background: rgba(8,11,18,0.85);
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
        }

        .product-content {
            padding: 19px;
        }

        .product-content h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            margin-bottom: 8px;
        }

        .description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            min-height: 42px;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }

        .price {
            font-family: 'Outfit', sans-serif;
            font-size: 23px;
            font-weight: 800;
            color: var(--green);
        }

        .price-note {
            font-size: 10px;
            color: var(--muted);
        }

        .buy-btn {
            display: block;
            width: 100%;
            background: var(--panel2);
            color: white;
            text-align: center;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .buy-btn:hover {
            background: #273348;
        }

        .purchase-btn {
            display: block;
            width: 100%;
            background: var(--green);
            color: #07140e;
            border: none;
            padding: 13px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .purchase-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .purchased {
            border-color: rgba(237,64,86,0.3);
        }

        .purchased .price {
            color: var(--muted);
        }

        .purchased .purchase-btn {
            background: rgba(237,64,86,0.13);
            color: #ff7181;
            border: 1px solid rgba(237,64,86,0.25);
            cursor: default;
        }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 65px 20px;
            background: var(--panel);
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .empty h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty p {
            color: var(--muted);
        }

        .footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 30px;
            color: var(--muted);
            font-size: 12px;
        }

        .footer span {
            color: var(--red);
        }

        @media(max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width: 550px) {
            .products {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 60px 20px;
            }

            .navbar {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">PRESENTS <span>HEHEHEHEH</span> 🎁</div>

        <div class="connection" id="connection">
            <span class="connection-dot"></span>
            <span id="connectionText">Connecting...</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-label">🎄 CHRISTMAS 2026</div>

        <h1>
            Presents<br>
            <span>heheheheh.</span>
        </h1>

        <p>Pick a budget. Find a present. 😈</p>
    </header>

    <main class="main">

        <section class="filter-panel">
            <div class="filter-heading">💰 Budget</div>

            <div class="filters">

                <div class="field">
                    <label for="minPrice">MINIMUM ($)</label>
                    <input type="number" id="minPrice" min="0" value="0">
                </div>

                <div class="field">
                    <label for="maxPrice">MAXIMUM ($)</label>
                    <input type="number" id="maxPrice" min="0" value="1000">
                </div>

                <div class="field">
                    <label for="sort">SORT BY</label>
                    <select id="sort">
                        <option value="recommended">Recommended</option>
                        <option value="low">Cheapest first</option>
                        <option value="high">Most expensive first</option>
                    </select>
                </div>

                <button class="apply-btn" onclick="filterProducts()">
                    Find presents →
                </button>

            </div>
        </section>

        <div class="section-header">
            <h2>🎁 The presents</h2>
            <div class="result-count" id="resultCount"></div>
        </div>

        <section class="products" id="products"></section>

    </main>

    <footer class="footer">
        <span>heheheheh</span> · Christmas 2026 🎄
    </footer>

    <script>

        // ==========================================
        // SUPABASE CONFIG
        // ==========================================

        const SUPABASE_URL = "https://pwpnclfmloebkokjcbis.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_kJmooLpQKLB88hrgG_qxeQ_H1h_1f6G";

        const supabaseConfigured =
            SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL" &&
            SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";

        let supabaseClient = null;

        if (supabaseConfigured && window.supabase && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );
        }


        // ==========================================
        // ALL OF THANOS' GIFTS
        // ==========================================

        const products = [

            {
                id: "1",
                name: "Eureka Ergonomic Z60 Desk",
                description: "Black 60-inch gaming desk.",
                price: 300,
                category: "DESK",
                image: "https://eurekaergonomic.com/cdn/shop/files/2_5d35e99a-1166-4908-b17f-dcc12c703f33.jpg?v=1757929789&width=1400",
                link: "https://eurekaergonomic.com/products/z60-gaming-desk-black-60"
            },

            {
                id: "2",
                name: "3Dconnexion SpaceMouse Pro",
                description: "Professional 3D navigation controller.",
                price: 300,
                category: "TECH",
                image: "https://3dconnexion.com/us/wp-content/uploads/sites/27/2022/09/spacemouse-pro_gallery_01.png",
                link: "https://www.3dconnexion.com/"
            },

            {
                id: "3",
                name: "Gaming Headset",
                description: "A new headset for gaming and music.",
                price: 100,
                category: "GAMING",
                image: "https://images.unsplash.com/photo-1599669454699-248893623440?w=700",
                link: "https://www.amazon.com/s?k=gaming+headset"
            },

            {
                id: "4",
                name: "Gaming Mouse",
                description: "A new mouse for his setup.",
                price: 80,
                category: "GAMING",
                image: "https://images.unsplash.com/photo-1527814050087-3793815479db?w=700",
                link: "https://www.amazon.com/s?k=gaming+mouse"
            },

            {
                id: "5",
                name: "Gaming Monitor",
                description: "A new monitor for his battlestation.",
                price: 250,
                category: "TECH",
                image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=700",
                link: "https://a.co/d/02XOU14V"
            },

            {
                id: "6",
                name: "Homall RGB Gaming Chair",
                description: "RGB lighting, footrest and adjustable backrest.",
                price: 150,
                category: "CHAIR",
                image: "https://homall.com/cdn/shop/files/4c94d3f6-70e4-49a8-a0bc-1401ab901911.5cb8e3de2ddc33f5b8fe4be04c0e5709.jpg?v=1768711341&width=1400",
                link: "https://www.amazon.com/dp/B0DKXJZHDL"
            }

        ];


        // ==========================================
        // PURCHASE STATUS
        // ==========================================

        let purchasedProducts = {};


        // ==========================================
        // CONNECTION STATUS
        // ==========================================

        function setConnection(status, message) {

            const connection = document.getElementById("connection");

            connection.className = "connection " + status;

            document.getElementById("connectionText").textContent = message;

        }


        // ==========================================
        // LOAD PURCHASE STATUS
        // ==========================================

        async function loadPurchaseStatuses() {

            if (!supabaseClient) {

                setConnection("offline", "Not connected");

                renderProducts();

                return;
            }

            try {

                const { data, error } = await supabaseClient
                    .from("gift_status")
                    .select("product_id, purchased");

                if (error) throw error;

                purchasedProducts = {};

                data.forEach(item => {
                    purchasedProducts[item.product_id] = item.purchased;
                });

                setConnection("online", "Live tracking");

                renderProducts();

            } catch (error) {

                console.error(error);

                setConnection("offline", "Connection error");

                alert("Couldn't load purchase statuses. Check your Supabase setup.");

            }

        }


        // ==========================================
        // MARK AS PURCHASED
        // ==========================================

        async function markPurchased(productId, button) {

            if (!supabaseClient) {
                alert("Supabase isn't connected yet!");
                return;
            }

            if (purchasedProducts[productId]) return;

            const confirmed = confirm(
                "You've bought this present? heheheheh 🎁"
            );

            if (!confirmed) return;

            button.disabled = true;
            button.textContent = "Saving...";

            try {

                const { error } = await supabaseClient
                    .from("gift_status")
                    .upsert(
                        {
                            product_id: productId,
                            purchased: true
                        },
                        {
                            onConflict: "product_id"
                        }
                    );

                if (error) throw error;

                purchasedProducts[productId] = true;

                renderProducts();

            } catch (error) {

                console.error(error);

                alert("Couldn't save. Try again!");

                button.disabled = false;
                button.textContent = "I've bought this!";

            }

        }


        // ==========================================
        // REALTIME UPDATES
        // ==========================================

        function setupRealtime() {

            if (!supabaseClient) return;

            supabaseClient
                .channel("gift-status-changes")

                .on(
                    "postgres_changes",
                    {
                        event: "*",
                        schema: "public",
                        table: "gift_status"
                    },
                    payload => {

                        const item = payload.new;

                        if (item && item.product_id) {

                            purchasedProducts[item.product_id] =
                                item.purchased;

                            renderProducts();

                        }

                    }
                )

                .subscribe(status => {

                    if (status === "SUBSCRIBED") {
                        setConnection("online", "Live tracking");
                    }

                    if (
                        status === "CHANNEL_ERROR" ||
                        status === "TIMED_OUT"
                    ) {
                        setConnection("offline", "Realtime disconnected");
                    }

                });

        }


        // ==========================================
        // FILTER PRODUCTS
        // ==========================================

        function filterProducts() {

            const minInput = document.getElementById("minPrice");
            const maxInput = document.getElementById("maxPrice");

            const min = Number(minInput.value);
            const max = Number(maxInput.value);

            if (
                minInput.value === "" ||
                maxInput.value === "" ||
                !Number.isFinite(min) ||
                !Number.isFinite(max) ||
                min < 0 ||
                max < 0 ||
                min > max
            ) {

                document.getElementById("products").innerHTML = `
                    <div class="empty">
                        <h3>Invalid budget 😭</h3>
                    </div>
                `;

                document.getElementById("resultCount").textContent = "";

                return;

            }

            const sort = document.getElementById("sort").value;

            let filtered = products.filter(product =>
                product.price >= min && product.price <= max
            );

            if (sort === "low") {
                filtered.sort((a, b) => a.price - b.price);
            }

            if (sort === "high") {
                filtered.sort((a, b) => b.price - a.price);
            }

            renderProducts(filtered);

        }


        // ==========================================
        // RENDER PRODUCTS
        // ==========================================

        function renderProducts(filteredProducts = null) {

            const container = document.getElementById("products");

            const min = Number(document.getElementById("minPrice").value);
            const max = Number(document.getElementById("maxPrice").value);

            let visibleProducts = filteredProducts;

            if (visibleProducts === null) {

                visibleProducts = products.filter(product =>
                    product.price >= min && product.price <= max
                );

            }

            const purchasedCount = visibleProducts.filter(product =>
                purchasedProducts[product.id] === true
            ).length;

            document.getElementById("resultCount").textContent =
                `${visibleProducts.length} presents · ${purchasedCount} bought`;

            if (visibleProducts.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>No presents here 😭</h3>
                    </div>
                `;

                return;

            }

            container.innerHTML = visibleProducts.map(product => {

                const purchased = purchasedProducts[product.id] === true;

                return `

                    <article class="product ${purchased ? "purchased" : ""}">

                        <div class="product-image">

                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='https://placehold.co/700x400/171f2c/ffffff?text=Present';"
                            >

                            <div class="category">
                                ${product.category}
                            </div>

                        </div>

                        <div class="product-content">

                            <h3>${product.name}</h3>

                            <p class="description">
                                ${product.description}
                            </p>

                            <div class="price-row">

                                <div class="price">
                                    $${product.price.toLocaleString("en-US")}
                                </div>

                                <div class="price-note">
                                    ESTIMATED
                                </div>

                            </div>

                            <a
                                class="buy-btn"
                                href="${product.link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                View present →
                            </a>

                            <button
                                class="purchase-btn"
                                ${purchased ? "disabled" : ""}
                                onclick="markPurchased('${product.id}', this)"
                            >
                                ${purchased ? "✓ Already bought!" : "I've bought this!"}
                            </button>

                        </div>

                    </article>

                `;

            }).join("");

        }


        // ==========================================
        // EVENT LISTENERS
        // ==========================================

        document
            .getElementById("sort")
            .addEventListener("change", filterProducts);

        document
            .getElementById("minPrice")
            .addEventListener("keydown", event => {
                if (event.key === "Enter") filterProducts();
            });

        document
            .getElementById("maxPrice")
            .addEventListener("keydown", event => {
                if (event.key === "Enter") filterProducts();
            });


        // ==========================================
        // START
        // ==========================================

        console.log("Starting gift website...");
        
        filterProducts();
        
        console.log("Products:", products);
        
        loadPurchaseStatuses();

setupRealtime();

    </script>

</body>
</html>
